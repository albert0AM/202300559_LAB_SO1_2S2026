services:
  valkey:
    image: valkey/valkey:8-alpine
    container_name: p2_valkey
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    command: valkey-server --save 60 1 --loglevel warning

  grafana:
    image: grafana/grafana:12.3.0
    container_name: p2_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - valkey
    environment:
      # Credenciales simples para desarrollo. Cambiar en produccion.
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      # Plugin Infinity: permite a Grafana leer los endpoints REST que expone
      # el Daemon de Go (que a su vez lee los logs guardados en Valkey).
      - GF_INSTALL_PLUGINS=yesoreyeram-infinity-datasource
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/proyecto2_grafana_dashboard.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  valkey-data:
  grafana-data: