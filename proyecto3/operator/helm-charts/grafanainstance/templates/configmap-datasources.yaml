apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "grafanainstance.fullname" . }}-datasources
  labels:
    {{- include "grafanainstance.labels" . | nindent 4 }}
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Valkey
        type: redis-datasource
        access: proxy
        isDefault: true
        url: {{ .Values.datasource.valkeyHost }}:{{ .Values.datasource.valkeyPort }}
        jsonData:
          client: standalone
