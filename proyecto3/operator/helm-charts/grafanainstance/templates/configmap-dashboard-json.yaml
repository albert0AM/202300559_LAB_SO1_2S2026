apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "grafanainstance.fullname" . }}-dashboard-json
  labels:
    {{- include "grafanainstance.labels" . | nindent 4 }}
data:
  # el dashboard vive en su propio archivo dentro del chart, aca solo lo metemos al configmap
  mumn-dashboard.json: |
{{ .Files.Get "dashboards/mumn-dashboard.json" | indent 4 }}
