apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "grafanainstance.fullname" . }}-dashboard-provider
  labels:
    {{- include "grafanainstance.labels" . | nindent 4 }}
data:
  dashboard-provider.yaml: |
    apiVersion: 1
    providers:
      - name: mumn-dashboards
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
