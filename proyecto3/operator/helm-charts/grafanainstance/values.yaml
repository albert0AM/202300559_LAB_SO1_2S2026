# Default values for grafanainstance.
replicaCount: 1

image:
  repository: grafana/grafana
  pullPolicy: IfNotPresent
  tag: "11.2.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

admin:
  user: admin
  password: "MumnGrafana2026"

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: LoadBalancer
  port: 3000

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /api/health
    port: http
readinessProbe:
  httpGet:
    path: /api/health
    port: http

datasource:
  valkeyHost: valkey
  valkeyPort: 6379

nodeSelector: {}
tolerations: []
affinity: {}
