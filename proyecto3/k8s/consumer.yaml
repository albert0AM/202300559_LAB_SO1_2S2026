apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer
  namespace: mumn
spec:
  replicas: 1
  selector:
    matchLabels: { app: consumer }
  template:
    metadata:
      labels: { app: consumer }
    spec:
      imagePullSecrets:
        - name: zot-cred
      containers:
        - name: consumer
          image: 34-132-3-94.nip.io/mumn/consumer:v2
          env:
            - name: RABBITMQ_URL
              value: "amqp://guest:guest@rabbitmq:5672/"
            - name: VALKEY_ADDR
              value: "valkey:6379"
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
