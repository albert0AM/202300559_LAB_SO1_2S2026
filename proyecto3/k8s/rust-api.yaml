apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-api
  namespace: mumn
spec:
  replicas: 1
  selector:
    matchLabels: { app: rust-api }
  template:
    metadata:
      labels: { app: rust-api }
    spec:
      imagePullSecrets:
        - name: zot-cred
      containers:
        - name: rust-api
          image: 34-132-3-94.nip.io/mumn/rust-api:v1
          ports:
            - containerPort: 8000
          env:
            - name: GO_API_URL
              value: "http://go-api-svc:8080/report"
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: rust-api-svc
  namespace: mumn
spec:
  selector: { app: rust-api }
  ports:
    - port: 8000
      targetPort: 8000
