apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: mumn
spec:
  replicas: 1
  selector:
    matchLabels: { app: valkey }
  template:
    metadata:
      labels: { app: valkey }
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8
          ports:
            - containerPort: 6379
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: mumn
spec:
  selector: { app: valkey }
  ports:
    - port: 6379
      targetPort: 6379
